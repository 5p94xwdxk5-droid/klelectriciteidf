<IfModule mod_rewrite.c>
RewriteEngine On

# Redirect only a requested index.html, never Apache's internal DirectoryIndex.
# The existing query string is preserved because no replacement query is set.
RewriteCond %{THE_REQUEST} "\s/+index\.html(?:[?\s])" [NC]
RewriteRule ^index\.html$ https://klelectricienidf.fr/ [R=301,L]

# Use one public HTTPS hostname for pages, images and discovery files.
RewriteCond %{HTTPS} !=on [OR]
RewriteCond %{HTTP_HOST} !^klelectricienidf\.fr$ [NC]
RewriteRule ^ https://klelectricienidf.fr%{REQUEST_URI} [R=301,L]
</IfModule>
# END KL ELECTRICIEN MANAGED SEO
