name: Publish electrician site to OVH

on:
  push:
    branches: [codex/site-preview]
    paths:
      - index.html
      - .github/workflows/deploy-ovh.yml
      - .github/ovh_known_hosts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ovh-electrician-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/codex/site-preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read the exact public commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid commit ID.' >&2; exit 1; }
          git init --quiet .
          git remote add origin https://github.com/5p94xwdxk5-droid/klelectriciteidf.git
          git -c credential.helper= fetch --quiet --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Publish index.html over SFTP
        shell: bash
        env:
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          
          if [[ -z "${OVH_SFTP_PASSWORD:-}" ]]; then
            echo 'Missing repository secret OVH_SFTP_PASSWORD. Add the OVH FTP/SFTP password in GitHub Settings > Secrets and variables > Actions.' >&2
            exit 1
          fi
          
          cd "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE must be set}"
          [[ -f index.html && -s index.html ]] || { echo 'The repository root index.html is missing or empty.' >&2; exit 1; }
          
          ovh_host='ftp.cluster129.hosting.ovh.net'
          ovh_login='klelecv'
          ovh_known_hosts="$PWD/.github/ovh_known_hosts"
          [[ -s "$ovh_known_hosts" ]] || { echo 'Missing .github/ovh_known_hosts. Enrol the OVH host key before deployment.' >&2; exit 1; }
          ssh-keygen -F "$ovh_host" -f "$ovh_known_hosts" >/dev/null || { echo 'The known-hosts file does not contain the expected OVH host.' >&2; exit 1; }
          
          [[ "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ && "${GITHUB_RUN_ATTEMPT:-}" =~ ^[0-9]+$ ]] || { echo 'Invalid GitHub run identifier.' >&2; exit 1; }
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid commit ID.' >&2; exit 1; }
          ovh_suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          ovh_upload=".index-upload-${ovh_suffix}.html"
          ovh_backup=".index-before-${ovh_suffix}.html"
          ovh_temp_dir=$(mktemp -d)
          trap 'rm -rf -- "$ovh_temp_dir"' EXIT
          
          # The helper reads the secret from the process environment. No password is
          # written into this file, into command arguments, or into diagnostic output.
          cat >"$ovh_temp_dir/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s\n' "$OVH_SFTP_PASSWORD"
          ASKPASS
          chmod 700 "$ovh_temp_dir/askpass"
          export SSH_ASKPASS="$ovh_temp_dir/askpass"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0
          
          ovh_sftp() {
            sftp -q \
              -o BatchMode=no \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$ovh_known_hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              -o PreferredAuthentications=password \
              -o PubkeyAuthentication=no \
              -o NumberOfPasswordPrompts=1 \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=2 \
              -P 22 -b - "$ovh_login@$ovh_host"
          }
          
          # Inspect the actual web directory first. A connection or listing failure
          # aborts; it is never treated as permission to replace an unknown file.
          ovh_sftp >"$ovh_temp_dir/listing" <<'SFTP'
          @cd www
          @ls -1a
          SFTP
          
          ovh_has_index=false
          while IFS= read -r ovh_entry; do
            if [[ "$ovh_entry" == 'index.html' ]]; then
              ovh_has_index=true
            fi
            if [[ "$ovh_entry" == "$ovh_upload" || "$ovh_entry" == "$ovh_backup" ]]; then
              echo 'A file from this deployment attempt already exists. Start a new run to avoid overwriting it.' >&2
              exit 1
            fi
          done <"$ovh_temp_dir/listing"
          
          # Download the existing page before any write. Abort if it cannot be backed up.
          if [[ "$ovh_has_index" == true ]]; then
            printf '@cd www\n@get index.html "%s/previous-index.html"\n' "$ovh_temp_dir" | ovh_sftp
            test -f "$ovh_temp_dir/previous-index.html"
          fi
          
          {
            printf '@cd www\n'
            printf '@put index.html %s\n' "$ovh_upload"
            printf '@chmod 644 %s\n' "$ovh_upload"
            if [[ "$ovh_has_index" == true ]]; then
              printf '@rename index.html %s\n' "$ovh_backup"
            fi
            printf '@rename %s index.html\n' "$ovh_upload"
          } >"$ovh_temp_dir/publish.batch"
          
          if ! ovh_sftp <"$ovh_temp_dir/publish.batch"; then
            # If the old index was moved but the final rename failed, restore it only
            # after confirming that no new index occupies its name. Never delete files.
            if [[ "$ovh_has_index" == true ]] && ovh_sftp >"$ovh_temp_dir/recovery-listing" <<'SFTP'
          @cd www
          @ls -1a
          SFTP
            then
              ovh_index_after_failure=false
              ovh_backup_after_failure=false
              while IFS= read -r ovh_entry; do
                [[ "$ovh_entry" != 'index.html' ]] || ovh_index_after_failure=true
                [[ "$ovh_entry" != "$ovh_backup" ]] || ovh_backup_after_failure=true
              done <"$ovh_temp_dir/recovery-listing"
              if [[ "$ovh_index_after_failure" == false && "$ovh_backup_after_failure" == true ]]; then
                if printf '@cd www\n@rename %s index.html\n' "$ovh_backup" | ovh_sftp; then
                  echo 'The previous index was restored after the failed publication.' >&2
                else
                  printf 'Automatic restoration failed. The previous index is retained at www/%s.\n' "$ovh_backup" >&2
                fi
              fi
            fi
            echo 'SFTP publication failed. No remote files were deleted; any temporary upload has been retained for recovery.' >&2
            exit 1
          fi
          
          echo 'OVH upload completed: www/index.html.'
          if [[ "$ovh_has_index" == true ]]; then
            printf 'Previous index retained as www/%s.\n' "$ovh_backup"
          fi

      - name: Verify the public HTTPS site
        shell: bash
        run: |
          python3 - <<'PYVERIFY'
          import hashlib, os, ssl, sys, time, urllib.parse, urllib.request
          from pathlib import Path
          
          expected = hashlib.sha256(Path("index.html").read_bytes()).digest()
          url = "https://klelectricienidf.fr/?deployment=" + os.environ["GITHUB_SHA"]
          for attempt in range(2):
              try:
                  request = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(request, context=ssl.create_default_context(), timeout=10) as response:
                      destination = urllib.parse.urlsplit(response.url)
                      if destination.scheme != "https" or destination.hostname not in {"klelectricienidf.fr", "www.klelectricienidf.fr"}:
                          raise ValueError("Unexpected public redirect")
                      if response.status != 200:
                          raise ValueError("The public site did not return HTTP 200")
                      actual = hashlib.sha256(response.read(5_000_001)).digest()
                  if actual != expected:
                      raise ValueError("The public home page does not yet match the uploaded index.html")
                  print("Verified exact site over public HTTPS: https://klelectricienidf.fr/")
                  break
              except Exception as error:
                  if attempt == 0:
                      print("Public HTTPS is not ready yet. Retrying once in 10 seconds.")
                      time.sleep(10)
                  else:
                      print("Upload completed, but public verification failed. Check OVH certificate/DNS propagation and the default index selection. " + str(error), file=sys.stderr)
                      sys.exit(1)
          PYVERIFY
