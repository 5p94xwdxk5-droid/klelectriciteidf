name: Publish electrician site to OVH

on:
  push:
    branches: [codex/site-preview]
    paths:
      - index.html
      - robots.txt
      - sitemap.xml
      - favicon.svg
      - favicon.png
      - favicon.ico
      - apple-touch-icon.png
      - kenido-electricien.jpg
      - lgreno-logo.png
      - chantier-cables-plafond.jpg
      - chantier-armoire-electrique.jpg
      - chantier-cheminement-cables.jpg
      - chantier-points-electriques.jpg
      - chantier-pose-prise.jpg
      - chantier-raccordement.jpg
      - .github/workflows/deploy-ovh.yml
      - .github/ovh_known_hosts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ovh-electrician-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/codex/site-preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read the exact public commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid commit ID.' >&2; exit 1; }
          git init --quiet .
          git remote add origin https://github.com/5p94xwdxk5-droid/klelectriciteidf.git
          git -c credential.helper= fetch --quiet --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Publish the site and available SEO assets over SFTP
        shell: bash
        env:
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD || secrets.OVH_SFTP_PASSWOR }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          if [[ -z "${OVH_SFTP_PASSWORD:-}" ]]; then
            echo 'Missing repository secret OVH_SFTP_PASSWORD (or OVH_SFTP_PASSWOR).' >&2
            exit 1
          fi
          cd "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE must be set}"
          [[ -s index.html && -f index.html ]] || { echo 'Root index.html is missing or empty.' >&2; exit 1; }

          # Explicit names only. Older commits can still be deployed before their optional
          # SEO assets are added. The home page is always promoted after every asset.
          ovh_candidates=(
            robots.txt sitemap.xml favicon.svg favicon.png favicon.ico apple-touch-icon.png
            kenido-electricien.jpg lgreno-logo.png chantier-cables-plafond.jpg
            chantier-armoire-electrique.jpg chantier-cheminement-cables.jpg
            chantier-points-electriques.jpg chantier-pose-prise.jpg chantier-raccordement.jpg
            index.html
          )
          ovh_files=()
          for ovh_file in "${ovh_candidates[@]}"; do
            if [[ -e "$ovh_file" ]]; then
              [[ -f "$ovh_file" && -s "$ovh_file" && ! -L "$ovh_file" ]] || { printf 'Invalid or empty deployment file: %s\n' "$ovh_file" >&2; exit 1; }
              ovh_files+=("$ovh_file")
            fi
          done

          ovh_host='ftp.cluster129.hosting.ovh.net'
          ovh_login='klelecv'
          ovh_known_hosts="$PWD/.github/ovh_known_hosts"
          [[ -s "$ovh_known_hosts" ]] || { echo 'Missing pinned OVH host key.' >&2; exit 1; }
          ssh-keygen -F "$ovh_host" -f "$ovh_known_hosts" >/dev/null || { echo 'The pinned key does not contain the expected OVH host.' >&2; exit 1; }
          [[ "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ && "${GITHUB_RUN_ATTEMPT:-}" =~ ^[0-9]+$ ]] || { echo 'Invalid GitHub run identifier.' >&2; exit 1; }
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid commit ID.' >&2; exit 1; }
          ovh_suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          ovh_temp_dir=$(mktemp -d)
          trap 'rm -rf -- "$ovh_temp_dir"' EXIT

          # The password stays in the process environment, never in command arguments,
          # the helper file, or diagnostic output.
          cat >"$ovh_temp_dir/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s\n' "$OVH_SFTP_PASSWORD"
          ASKPASS
          chmod 700 "$ovh_temp_dir/askpass"
          export SSH_ASKPASS="$ovh_temp_dir/askpass"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0

          ovh_sftp() {
            sftp -q \
              -o BatchMode=no \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$ovh_known_hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              -o PreferredAuthentications=password \
              -o PubkeyAuthentication=no \
              -o NumberOfPasswordPrompts=1 \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=2 \
              -P 22 -b - "$ovh_login@$ovh_host"
          }

          declare -A ovh_remote=()
          ovh_read_listing() {
            if ! printf '@ls -1a www\n' | ovh_sftp >"$ovh_temp_dir/listing"; then
              echo 'Cannot inspect the OVH directory; no unknown file will be replaced.' >&2
              return 1
            fi
            ovh_remote=()
            while IFS= read -r ovh_entry; do
              ovh_entry="${ovh_entry#www/}"
              [[ -z "$ovh_entry" ]] || ovh_remote["$ovh_entry"]=1
            done <"$ovh_temp_dir/listing"
          }

          ovh_read_listing
          declare -A ovh_had_file=()
          for ovh_file in "${ovh_files[@]}"; do
            ovh_had_file["$ovh_file"]="${ovh_remote[$ovh_file]:-0}"
            for ovh_kind in upload before failed; do
              ovh_reserved=".ovh-${ovh_kind}-${ovh_suffix}-${ovh_file}"
              if [[ "${ovh_remote[$ovh_reserved]:-0}" == 1 ]]; then
                echo 'This deployment attempt already has remote files. Start a new run or rerun attempt.' >&2
                exit 1
              fi
            done
          done

          # Upload and chmod every new file before touching any public pathname.
          for ovh_file in "${ovh_files[@]}"; do
            printf 'put %s www/.ovh-upload-%s-%s\n' "$ovh_file" "$ovh_suffix" "$ovh_file"
            printf 'chmod 644 www/.ovh-upload-%s-%s\n' "$ovh_suffix" "$ovh_file"
          done >"$ovh_temp_dir/upload.batch"
          if ! ovh_sftp <"$ovh_temp_dir/upload.batch"; then
            echo 'Upload failed before promotion. Public files are untouched; partial temporary uploads are retained.' >&2
            exit 1
          fi

          # Preserve each old file, including a provider symlink, then rename its staged
          # replacement. SFTP cannot atomically replace multiple files as a single unit.
          for ovh_file in "${ovh_files[@]}"; do
            if [[ "${ovh_had_file[$ovh_file]}" == 1 ]]; then
              printf 'rename www/%s www/.ovh-before-%s-%s\n' "$ovh_file" "$ovh_suffix" "$ovh_file"
            fi
            printf 'rename www/.ovh-upload-%s-%s www/%s\n' "$ovh_suffix" "$ovh_file" "$ovh_file"
          done >"$ovh_temp_dir/promote.batch"

          if ! ovh_sftp <"$ovh_temp_dir/promote.batch"; then
            echo 'Promotion failed. Restoring the prior files wherever their backup is present.' >&2
            if ovh_read_listing; then
              for ovh_file in "${ovh_files[@]}"; do
                ovh_backup=".ovh-before-${ovh_suffix}-${ovh_file}"
                ovh_failed=".ovh-failed-${ovh_suffix}-${ovh_file}"
                if [[ "${ovh_remote[$ovh_backup]:-0}" != 1 ]]; then
                  continue
                fi
                if [[ "${ovh_remote[$ovh_failed]:-0}" == 1 ]]; then
                  printf 'Recovery collision; prior %s remains at www/%s.\n' "$ovh_file" "$ovh_backup" >&2
                  continue
                fi
                {
                  if [[ "${ovh_remote[$ovh_file]:-0}" == 1 ]]; then
                    printf 'rename www/%s www/%s\n' "$ovh_file" "$ovh_failed"
                  fi
                  printf 'rename www/%s www/%s\n' "$ovh_backup" "$ovh_file"
                } >"$ovh_temp_dir/restore.batch"
                if ovh_sftp <"$ovh_temp_dir/restore.batch"; then
                  printf 'Restored previous %s.\n' "$ovh_file" >&2
                else
                  printf 'Restoration failed; prior %s remains at www/%s.\n' "$ovh_file" "$ovh_backup" >&2
                fi
              done
            fi
            echo 'Deployment failed. No remote files were deleted. Newly introduced assets can remain unreferenced; inspect retained backups before retrying.' >&2
            exit 1
          fi

          printf 'Published %s files; index.html was promoted last.\n' "${#ovh_files[@]}"
          printf 'Previous versions remain under www/.ovh-before-%s-<filename>.\n' "$ovh_suffix"

      - name: Verify every public HTTPS file
        shell: bash
        run: |
          python3 - <<'PYVERIFY'
          import hashlib
          import os
          import re
          import ssl
          import sys
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          names = (
              "robots.txt", "sitemap.xml", "favicon.svg", "favicon.png", "favicon.ico",
              "apple-touch-icon.png", "kenido-electricien.jpg", "lgreno-logo.png",
              "chantier-cables-plafond.jpg", "chantier-armoire-electrique.jpg",
              "chantier-cheminement-cables.jpg", "chantier-points-electriques.jpg",
              "chantier-pose-prise.jpg", "chantier-raccordement.jpg", "index.html",
          )
          allowed_types = {
              ".html": {"text/html", "application/xhtml+xml"},
              ".txt": {"text/plain"},
              ".xml": {"application/xml", "text/xml"},
              ".svg": {"image/svg+xml"},
              ".png": {"image/png"},
              ".jpg": {"image/jpeg"},
              ".ico": {"image/x-icon", "image/vnd.microsoft.icon", "image/ico"},
          }
          if not Path("index.html").is_file():
              sys.exit("The required index.html is missing.")

          for name in names:
              path = Path(name)
              if not path.is_file():
                  continue
              expected = hashlib.sha256(path.read_bytes()).digest()
              public_path = "/" if name == "index.html" else "/" + name
              url = "https://klelectricienidf.fr" + public_path + "?deployment=" + os.environ["GITHUB_SHA"]
              for attempt in range(2):
                  try:
                      request = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                      with urllib.request.urlopen(request, context=ssl.create_default_context(), timeout=10) as response:
                          destination = urllib.parse.urlsplit(response.url)
                          if destination.scheme != "https" or destination.hostname not in {"klelectricienidf.fr", "www.klelectricienidf.fr"}:
                              raise ValueError("Unexpected public redirect")
                          if response.status != 200:
                              raise ValueError("HTTP status is not 200")
                          content_type = response.headers.get_content_type()
                          if content_type not in allowed_types[path.suffix]:
                              raise ValueError(f"Unexpected Content-Type: {content_type}")
                          if name == "index.html":
                              directives = ",".join(response.headers.get_all("X-Robots-Tag", []))
                              if re.search(r"(?<![a-z])(?:noindex|none)(?![a-z])", directives, re.I):
                                  raise ValueError("The host sends an X-Robots-Tag that blocks indexing")
                          actual = hashlib.sha256(response.read(path.stat().st_size + 1)).digest()
                          if actual != expected:
                              raise ValueError("Public bytes do not match the deployed file")
                      print(f"Verified public HTTPS bytes and Content-Type: {public_path}")
                      break
                  except Exception as error:
                      if attempt == 0:
                          print(f"Verification of {public_path} failed; retrying once in 10 seconds.")
                          time.sleep(10)
                      else:
                          sys.exit(f"Upload finished, but public verification failed for {public_path}: {error}. Retained remote backups remain available for recovery.")
          PYVERIFY
